<div class="login-wrap">
  <div class="login-card card">
    <svg class="brand-logo" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <ellipse cx="15" cy="11" rx="5.5" ry="14" fill="var(--color-primary)" transform="rotate(-18 15 11)" />
      <ellipse cx="33" cy="11" rx="5.5" ry="14" fill="var(--color-primary)" transform="rotate(18 33 11)" />
      <circle cx="24" cy="29" r="13" fill="var(--color-primary)" />
      <circle cx="19.5" cy="27" r="1.6" fill="#fff" />
      <circle cx="28.5" cy="27" r="1.6" fill="#fff" />
      <path d="M20.5 33.5c2.2 1.8 4.8 1.8 7 0" stroke="#fff" stroke-width="2" stroke-linecap="round" />
    </svg>
    <h1>RabbitLab</h1>
    <p class="tagline">Seu cofre de cartas de TCG.</p>

    @if (loading) {
      <div class="loading-block"><span class="spinner"></span><span>Conectando…</span></div>
    } @else if (loginUrl) {
      <button class="btn btn-primary btn-google" (click)="loginWithGoogle()">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Entrar com Google
      </button>
    } @else {
      <p class="error">{{ error || 'Nenhuma forma de login disponível.' }}</p>
    }

    @if (devWarning) {
      <p class="dev-warning">{{ devWarning }}</p>
    }
  </div>
</div>
